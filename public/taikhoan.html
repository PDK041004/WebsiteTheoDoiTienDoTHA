<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quản lý tài khoản</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- HEADER -->
<nav class="navbar navbar-dark bg-danger">
    <div class="container">
        <span class="navbar-brand">QUẢN TRỊ HỆ THỐNG</span>
        <div class="ms-auto">
          <a href="giaodien.html" class="btn btn-outline-light">Đăng xuất</a>
    </div>
    </div>
</nav>

<div class="container mt-4">

    <h4>Quản lý tài khoản & phân quyền</h4>

    <!-- BUTTON -->
    <button class="btn btn-danger mb-3" data-bs-toggle="modal" data-bs-target="#addModal">
        + Thêm tài khoản
    </button>

    <!-- TABLE -->
    <table class="table table-bordered">
        <thead class="table-danger">
            <tr>
                <th>ID</th>
                <th>Tên đăng nhập</th>
                <th>Họ tên</th>
                <th>Vai trò</th>
                <th>Thao tác</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>1</td>
                <td>admin</td>
                <td>Quản trị</td>
                <td>
                    <span class="badge bg-danger">Admin</span>
                </td>
                <td>
                    <button class="btn btn-warning btn-sm" data-bs-toggle="modal" data-bs-target="#editModal">Sửa</button>
                    <button class="btn btn-danger btn-sm">Xóa</button>
                </td>
            </tr>

            <tr>
                <td>2</td>
                <td>user01</td>
                <td>Nguyễn Văn A</td>
                <td>
                    <span class="badge bg-primary">Người dân</span>
                </td>
                <td>
                    <button class="btn btn-warning btn-sm" data-bs-toggle="modal" data-bs-target="#editModal">Sửa</button>
                    <button class="btn btn-danger btn-sm">Xóa</button>
                </td>
            </tr>
        </tbody>
    </table>

</div>

<!-- MODAL THÊM -->
<div class="modal fade" id="addModal">
<div class="modal-dialog">
<div class="modal-content">

    <div class="modal-header bg-danger text-white">
        <h5>Thêm tài khoản</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
    </div>

    <div class="modal-body">
        <form onsubmit="addUser(event)">

            <div class="mb-2">
                <label>Tên đăng nhập</label>
                <input type="text" class="form-control">
            </div>

            <div class="mb-2">
                <label>Mật khẩu</label>
                <input type="password" class="form-control">
            </div>

            <div class="mb-2">
                <label>Họ tên</label>
                <input type="text" class="form-control">
            </div>

            <div class="mb-2">
                <label>Vai trò</label>
                <select class="form-control">
                    <option>Admin</option>
                    <option>Công chức</option>
                    <option>Chấp hành viên</option>
                    <option>Người dân</option>
                </select>
            </div>

            <button class="btn btn-danger w-100">Lưu</button>

        </form>
    </div>

</div>
</div>
</div>

<!-- MODAL SỬA -->
<div class="modal fade" id="editModal">
<div class="modal-dialog">
<div class="modal-content">

    <div class="modal-header bg-warning">
        <h5>Sửa tài khoản</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
    </div>

    <div class="modal-body">
        <form onsubmit="updateUser(event)">

            <div class="mb-2">
                <label>Tên đăng nhập</label>
                <input type="text" class="form-control" value="user01">
            </div>

            <div class="mb-2">
                <label>Họ tên</label>
                <input type="text" class="form-control" value="Nguyễn Văn A">
            </div>

            <div class="mb-2">
                <label>Vai trò</label>
                <select class="form-control">
                    <option>Admin</option>
                    <option selected>Người dân</option>
                    <option>Công chức</option>
                    <option>Chấp hành viên</option>
                </select>
            </div>

            <button class="btn btn-warning w-100">Cập nhật</button>

        </form>
    </div>

</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
function loadUsers(){
    fetch("/users")
    .then(res=>res.json())
    .then(data=>{
        let html = "";

        data.forEach(u=>{
            html += `
            <tr>
                <td>${u.id}</td>
                <td>${u.username}</td>
                <td>${u.fullname}</td>
                <td>${u.role}</td>
                <td>
                    <button class="btn btn-warning btn-sm" onclick="editUser(${u.id}, '${u.fullname}', '${u.role}')">Sửa</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id})">Xóa</button>
                </td>
            </tr>
            `;
        });

        document.querySelector("tbody").innerHTML = html;
    });
}

window.onload = loadUsers;
</script>

<script>
function addUser(e){
    e.preventDefault();

    const data = {
        username: document.querySelector("#addModal input[type='text']").value,
        password: document.querySelector("#addModal input[type='password']").value,
        fullname: document.querySelectorAll("#addModal input[type='text']")[1].value,
        role: document.querySelector("#addModal select").value
    };

    fetch("/users",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(data)
    })
    .then(res=>res.text())
    .then(msg=>{
        alert(msg);
        loadUsers();
    });
}
</script>

<script>
let currentId = null;

function editUser(id, fullname, role){
    currentId = id;

    document.querySelector("#editModal input[type='text']").value = fullname;
    document.querySelector("#editModal select").value = role;

    new bootstrap.Modal(document.getElementById('editModal')).show();
}

function updateUser(e){
    e.preventDefault();

    const data = {
        fullname: document.querySelector("#editModal input[type='text']").value,
        role: document.querySelector("#editModal select").value
    };

    fetch("/users/" + currentId,{
        method:"PUT",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(data)
    })
    .then(res=>res.text())
    .then(msg=>{
        alert(msg);
        loadUsers();
    });
}
</script>

<script>
function deleteUser(id){
    if(confirm("Xóa tài khoản này?")){
        fetch("/users/" + id,{
            method:"DELETE"
        })
        .then(res=>res.text())
        .then(msg=>{
            alert(msg);
            loadUsers();
        });
    }
}
</script>

</body>
</html>
