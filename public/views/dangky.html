<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card">
                <div class="card-header bg-danger text-white text-center">
                    <h4>Đăng ký tài khoản</h4>
                </div>

                <div class="card-body">
                    <form onsubmit="register(event)">

                        <div class="mb-2">
                            <label>Họ và tên</label>
                            <input type="text" class="form-control" required>
                        </div>

                        <div class="mb-2">
                            <label>Số điện thoại</label>
                            <input type="text" class="form-control" required>
                        </div>

                        <div class="mb-2">
                            <label>CCCD</label>
                            <input type="text" class="form-control" required>
                        </div>

                        <div class="mb-2">
                            <label>Email</label>
                            <input type="email" class="form-control" required>
                        </div>

                        <div class="mb-2">
                            <label>Địa chỉ</label>
                            <input type="text" class="form-control" required>
                        </div>

                        <div class="mb-2">
                            <label>Ngày sinh</label>
                            <input type="date" class="form-control" required>
                        </div>

                        <div class="mb-2">
                            <label>Mật khẩu</label>
                            <input type="password" class="form-control" required>
                        </div>

                        <div class="mb-2">
                            <label>Nhập lại mật khẩu</label>
                            <input type="password" class="form-control" required>
                        </div>

                        <button class="btn btn-danger w-100 mt-3">Đăng ký</button>

                        <div class="text-center mt-3">
                            <a href="giaodien.html">← Quay lại trang chủ</a>
                        </div>

                    </form>
                </div>

            </div>

        </div>
    </div>
</div>

<script>
function register(e){
    e.preventDefault();

    const data = {
        username: document.querySelector("input[type='email']").value,
        password: document.querySelector("input[type='password']").value,
        fullname: document.querySelector("input[type='text']").value
    };

    fetch("/register",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(data)
    })
    .then(res=>res.text())
    .then(msg=>{
        alert(msg);
        location = "giaodien.html";
    });
}
</script>

</body>
</html>
