<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quản lý tài khoản</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- HEADER -->
<nav class="navbar navbar-dark bg-danger">
    <div class="container">
        <span class="navbar-brand">QUẢN TRỊ HỆ THỐNG</span>
        <div class="ms-auto">
             <a class="btn btn-outline-light me-2" href="/bao-cao">Báo cáo hồ sơ</a>
          <button class="btn btn-outline-light" onclick="signOut()">Đăng xuất</button>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h4>Quản lý tài khoản & phân quyền</h4>

    <button class="btn btn-danger mb-3" data-bs-toggle="modal" data-bs-target="#addModal">
        + Thêm tài khoản
    </button>

    <table class="table table-bordered">
        <thead class="table-danger">
            <tr>
                <th>STT</th>
                <th>Tên đăng nhập</th>
                <th>Họ tên</th>
                <th>Số điện thoại</th>
                <th>Vai trò</th>
                <th>Thao tác</th>
            </tr>
        </thead>
        <tbody id="accountBody"></tbody>
    </table>

</div>

<!-- MODAL THÊM -->
<div class="modal fade" id="addModal">
<div class="modal-dialog">
<div class="modal-content">

    <div class="modal-header bg-danger text-white">
        <h5>Thêm tài khoản</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
    </div>

    <div class="modal-body">
        <form id="addForm" onsubmit="addUser(event)">

            <div class="mb-2">
                <label>Tên đăng nhập</label>
                <input type="text" id="addUserName" class="form-control" required>
            </div>

            <div class="mb-2">
                <label>Họ tên</label>
                <input type="text" id="addFullname" class="form-control">
            </div>

            <div class="mb-2">
                <label>Số điện thoại</label>
                <input type="text" id="addPhone" maxlength="10" class="form-control" required>
            </div>

            <div class="mb-2">
                <label>Mật khẩu</label>
                <input type="password" id="addPassword" class="form-control" required>
            </div>

            <div class="mb-2">
                <label>Vai trò</label>
                <select id="addRole" class="form-control">
                    <option value="0">Người dân</option>
                    <option value="1">Chấp hành viên</option>
                    <option value="2">Công chức</option>
                    <option value="3">Admin</option>
                </select>
            </div>

            <button class="btn btn-danger w-100">Lưu</button>

        </form>
    </div>

</div>
</div>
</div>

<!-- MODAL SỬA -->
<div class="modal fade" id="editModal">
<div class="modal-dialog">
<div class="modal-content">

    <div class="modal-header bg-warning">
        <h5>Sửa tài khoản</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
    </div>

    <div class="modal-body">
        <form onsubmit="updateUser(event)">

            <div class="mb-2">
                <label>Tên đăng nhập</label>
                <input type="text" id="editUsername" class="form-control" readonly>
            </div>

            <div class="mb-2">
                <label>Họ tên</label>
                <input type="text" id="editFullname" class="form-control">
            </div>

            <div class="mb-2">
                <label>Số điện thoại</label>
                <input type="text" id="editPhone" maxlength="10" class="form-control">
            </div>

            <div class="mb-2">
                <label>Mật khẩu mới (để trống nếu không đổi)</label>
                <input type="password" id="editPassword" class="form-control">
            </div>

            <div class="mb-2">
                <label>Vai trò</label>
                <select id="editRole" class="form-control">
                    <option value="0">Người dân</option>
                    <option value="1">Chấp hành viên</option>
                    <option value="2">Công chức</option>
                    <option value="3">Admin</option>
                </select>
            </div>

            <button class="btn btn-warning w-100">Cập nhật</button>

        </form>
    </div>

</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
const ROLE_NAMES = { 0: "Người dân", 1: "Chấp hành viên", 2: "Công chức", 3: "Admin" };
const ROLE_BADGES = { 0: "bg-primary", 1: "bg-success", 2: "bg-info text-dark", 3: "bg-danger" };

let accountsList = [];
let currentId = null;

// Chống chèn mã HTML từ dữ liệu người dùng
function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => (
        { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
}

async function signOut() {
    try {
        const res = await fetch("/dang-xuat", {
            method: "GET",
            credentials: "include",
            headers: { "Content-Type": "application/json" }
        });
        const data = await res.json();
        alert(data.message);
        window.location.href = "/trang-chu";
    } catch (error) {
        console.error(error);
        alert("Error signing out");
    }
}

async function loadAccounts() {
    try {
        const res = await fetch("/tai-khoan/api", { credentials: "include" });
        const data = await res.json();
        if (!res.ok) { alert(data.message || "Không tải được danh sách"); return; }

        accountsList = data.accounts;

        // Mỗi dòng có đúng 6 ô, khớp với 6 cột tiêu đề
        document.getElementById("accountBody").innerHTML = accountsList.map((a, i) => `
            <tr>
                <td>${i + 1}</td>
                <td>${esc(a.userName)}</td>
                <td>${esc(a.fullname)}</td>
                <td>${esc(a.phoneNumber)}</td>
                <td><span class="badge ${ROLE_BADGES[a.role] || "bg-secondary"}">${esc(ROLE_NAMES[a.role] ?? "Người dân")}</span></td>
                <td>
                    <button class="btn btn-warning btn-sm" onclick="editUser(${i})">Sửa</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteUser(${i})">Xóa</button>
                </td>
            </tr>
        `).join("");
    } catch (error) {
        console.error(error);
        alert("Error finding accounts");
    }
}

async function addUser(e) {
    e.preventDefault();

    const data = {
        userName: document.getElementById("addUserName").value.trim(),
        fullname: document.getElementById("addFullname").value.trim(),
        phoneNumber: document.getElementById("addPhone").value.trim(),
        password: document.getElementById("addPassword").value,
        role: Number(document.getElementById("addRole").value)
    };

    try {
        const res = await fetch("/tai-khoan/api", {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });
        const obj = await res.json();
        alert(obj.message);
        if (res.ok) {
            bootstrap.Modal.getInstance(document.getElementById("addModal")).hide();
            document.getElementById("addForm").reset();
            loadAccounts();
        }
    } catch (error) {
        console.error(error);
        alert("Error creating account");
    }
}

function editUser(index) {
    const u = accountsList[index];
    currentId = u._id;

    document.getElementById("editUsername").value = u.userName;
    document.getElementById("editFullname").value = u.fullname || "";
    document.getElementById("editPhone").value = u.phoneNumber || "";
    document.getElementById("editPassword").value = "";
    document.getElementById("editRole").value = u.role;

    bootstrap.Modal.getOrCreateInstance(document.getElementById("editModal")).show();
}

async function updateUser(e) {
    e.preventDefault();

    const data = {
        fullname: document.getElementById("editFullname").value.trim(),
        phoneNumber: document.getElementById("editPhone").value.trim(),
        role: Number(document.getElementById("editRole").value)
    };
    const newPassword = document.getElementById("editPassword").value;
    if (newPassword) data.password = newPassword;

    try {
        const res = await fetch("/tai-khoan/api/" + currentId, {
            method: "PUT",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
        });
        const obj = await res.json();
        alert(obj.message);
        if (res.ok) {
            bootstrap.Modal.getInstance(document.getElementById("editModal")).hide();
            loadAccounts();
        }
    } catch (error) {
        console.error(error);
        alert("Error updating account");
    }
}

async function deleteUser(index) {
    const u = accountsList[index];
    if (!confirm("Xóa tài khoản " + u.userName + "?")) return;

    try {
        const res = await fetch("/tai-khoan/api/" + u._id, {
            method: "DELETE",
            credentials: "include"
        });
        const obj = await res.json();
        alert(obj.message);
        if (res.ok) loadAccounts();
    } catch (error) {
        console.error(error);
        alert("Error deleting account");
    }
}

window.addEventListener("DOMContentLoaded", loadAccounts);
</script>

</body>
</html>
