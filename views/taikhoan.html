<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Quản lý tài khoản</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- HEADER -->
<nav class="navbar navbar-dark bg-danger">
    <div class="container">
        <span class="navbar-brand">QUẢN TRỊ HỆ THỐNG</span>
        <div class="ms-auto">
          <button class="btn btn-outline-light" onclick="signOut()">Đăng xuất</button>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h4>Quản lý tài khoản & phân quyền</h4>

    <!-- BUTTON -->
    <button class="btn btn-danger mb-3" data-bs-toggle="modal" data-bs-target="#addModal">
        + Thêm tài khoản
    </button>

    <!-- TABLE -->
    <table class="table table-bordered">
        <thead class="table-danger">
            <tr>
                <th>STT</th>
                <th>Tên đăng nhập</th>
                <th>Họ tên</th>
                <th>Số điện thoại</th>
                <th>Vai trò</th>
                <th>Thao tác</th>
            </tr>
        </thead>

        <tbody>
        </tbody>
    </table>

</div>

<!-- MODAL THÊM -->
<div class="modal fade" id="addModal">
<div class="modal-dialog">
<div class="modal-content">

    <div class="modal-header bg-danger text-white">
        <h5>Thêm tài khoản</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
    </div>

    <div class="modal-body">
        <form onsubmit="addUser(event)">

            <div class="mb-2">
                <label>Tên đăng nhập</label>
                <input type="user-name" class="form-control">
            </div>

            <div class="mb-2">
                <label>Số điện thoại</label>
                <input type="phone-number" maxlength="10" class="form-control">
            </div>

            <div class="mb-2">
                <label>Mật khẩu</label>
                <input type="password" class="form-control">
            </div>

            <!-- <div class="mb-2">
                <label>Họ tên</label>
                <input type="text" class="form-control">
            </div> -->

            <div class="mb-2">
                <label>Vai trò</label>
                <select class="form-control">
                    <option value="0">Người dân</option>
                    <option value="1">Chấp hành viên</option>
                    <option value="2">Công chức</option>
                    <option value="3">Admin</option>
                </select>
            </div>

            <button class="btn btn-danger w-100">Lưu</button>

        </form>
    </div>

</div>
</div>
</div>

<!-- MODAL SỬA -->
<div class="modal fade" id="editModal">
<div class="modal-dialog">
<div class="modal-content">

    <div class="modal-header bg-warning">
        <h5>Sửa tài khoản</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
    </div>

    <div class="modal-body">
        <form onsubmit="updateUser(event)">

    <div class="mb-2">
        <label>Tên đăng nhập</label>
        <input type="text" id="editUsername" class="form-control" readonly>
    </div>

    <div class="mb-2">
        <label>Họ tên</label>
        <input type="text" id="editFullname" class="form-control">
    </div>
    <div class="mb-2">
        <label>Số điện thoại</label>
        <input type="text" id="editPhone" class="form-control">
    </div>
    <div class="mb-2">
        <label>Vai trò</label>
        <select id="editRole" class="form-control">
            <option>Admin</option>
            <option>Công chức</option>
            <option>Chấp hành viên</option>
            <option>Người dân</option>
        </select>
    </div>

    <button class="btn btn-warning w-100">Cập nhật</button>

</form>
    </div>

</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>



</script>

<script>
async function signOut() {
    try {
        const res = await fetch("/dang-xuat", {
            method: "GET",
            credentials: "include",
            headers: { "Content-Type":"application/json" }
        });
        
        const data = await res.json();
        alert(data.message);
        window.location.href = "/trang-chu";
    } catch (error) {
        console.error(error);
        alert("Error signing out");
    }
}

async function loadAccounts() {
    try {
        const res = await fetch("/tai-khoan/api", {
            method: "GET",
            credentials: "include",
            headers:{ "Content-Type":"application/json" }
        })
        const data = await res.json();
        alert(data.accounts.length + " accounts found.");

        let html = "";

        data.accounts.forEach(account => {
            if(account.role === 0) { account.role = "Người dân"; }
            else if(account.role === 1) { account.role = "Chấp hành viên"; }
            else if(account.role === 2) { account.role = "Công chức"; }
            else if(account.role === 3) { account.role = "Admin"; }
            html += `
            <tr>
                <td>${account._id}</td>
                <td>${account.userName}</td>
                <td></td>
                <td>${account.role}</td>
                <td>
                    <button class="btn btn-warning btn-sm" onclick="editUser(${account.id}, '${account.fullname}', '${account.role}')">Sửa</button>
                    <button class="btn btn-danger btn-sm" onclick="deleteUser(${account.id})">Xóa</button>
                </td>
            </tr>
            `;
        });

        document.querySelector("tbody").innerHTML = html;
    } catch (error) {
        console.error(error);
        alert("Error finding accounts");
    }
}

async function addUser(e){
    e.preventDefault();

    const data = {
        userName: document.querySelector("#addModal input[type='user-name']").value,
        phoneNumber: document.querySelector("#addModal input[type='phone-number'][maxlength='10']").value,
        password: document.querySelector("#addModal input[type='password']").value,
        role: document.querySelector("#addModal select").value
    };

    const res = await fetch("/tai-khoan/api",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(data)
    })

    const obj = await res.json();
        alert(obj.message);
        loadAccounts();
}

window.onload = loadAccounts();
</script>

<script>
let currentId = null;

function editUser(index){
    const u = usersList[index];
    currentId = u.id;

    document.getElementById("editUsername").value = u.username;
    document.getElementById("editFullname").value = u.fullname;
    document.getElementById("editPhone").value = u.phone;
    document.getElementById("editRole").value = u.role;

    new bootstrap.Modal(document.getElementById('editModal')).show();
}

function updateUser(e){
    e.preventDefault();

    const data = {
    fullname: document.getElementById("editFullname").value,
    phone: document.getElementById("editPhone").value,
    role: document.getElementById("editRole").value
};

    fetch("/users/" + currentId,{
        method:"PUT",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(data)
    })
    .then(res=>res.text())
    .then(msg=>{
        alert(msg);
        loadUsers();
        bootstrap.Modal.getInstance(document.getElementById('editModal')).hide();
    });
}
</script>

<script>
function deleteUser(id){
    if(confirm("Xóa tài khoản này?")){
        fetch("/tai-khoan/dang-ky" + id,{
            method:"DELETE"
        })
        .then(res=>res.text())
        .then(msg=>{
            alert(msg);
            loadUsers();
        });
    }
}
</script>

</body>
</html>
