<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo cáo doanh thu</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-danger">
    <div class="container">
        <span class="navbar-brand">QUẢN TRỊ HỆ THỐNG</span>
        <div class="ms-auto d-flex flex-wrap gap-2">
            <a class="btn btn-outline-light" href="/tai-khoan">Quản lý tài khoản</a>
            <a class="btn btn-outline-light" href="/bao-cao">Báo cáo hồ sơ</a>
            <a class="btn btn-outline-light" href="/phieu-thu">Lập phiếu thu</a>
            <button class="btn btn-outline-light" onclick="signOut()">Đăng xuất</button>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h4>Báo cáo doanh thu</h4>

    <div class="d-flex align-items-center flex-wrap gap-2 mb-3">
        <label for="tu" class="mb-0">Từ ngày:</label>
        <input type="date" id="tu" class="form-control w-auto" onchange="loadDoanhThu()">
        <label for="den" class="mb-0">đến ngày:</label>
        <input type="date" id="den" class="form-control w-auto" onchange="loadDoanhThu()">
    </div>

    <div class="row g-2 mb-3">
        <div class="col-6 col-md-3"><div class="border rounded p-2 text-center">
            <div class="fs-4 fw-bold text-danger" id="tSoPhieu">0</div><div class="small">Số phiếu thu</div></div></div>
        <div class="col-6 col-md-3"><div class="border rounded p-2 text-center">
            <div class="fs-5 fw-bold text-danger" id="tAnPhi">0 đ</div><div class="small">Tổng án phí</div></div></div>
        <div class="col-6 col-md-3"><div class="border rounded p-2 text-center">
            <div class="fs-5 fw-bold text-danger" id="tPhiTHA">0 đ</div><div class="small">Tổng phí thi hành án</div></div></div>
        <div class="col-6 col-md-3"><div class="border rounded p-2 text-center bg-light">
            <div class="fs-5 fw-bold text-danger" id="tDoanhThu">0 đ</div><div class="small">Tổng doanh thu</div></div></div>
    </div>

    <div class="table-responsive">
    <table class="table table-bordered">
        <thead class="table-danger">
            <tr>
                <th>STT</th>
                <th>Số phiếu</th>
                <th>Ngày lập</th>
                <th>Mã hồ sơ</th>
                <th>Người thi hành</th>
                <th>Loại hồ sơ</th>
                <th>Chấp hành viên</th>
                <th>Người nộp</th>
                <th>Người thu</th>
                <th class="text-end">Án phí</th>
                <th class="text-end">Phí thi hành án</th>
                <th class="text-end">Thành tiền</th>
            </tr>
        </thead>
        <tbody id="phieuBody"></tbody>
        <tfoot id="phieuFoot"></tfoot>
    </table>
    </div>
</div>

<script>
const $ = id => document.getElementById(id);
const tien = n => new Intl.NumberFormat("vi-VN").format(n || 0) + " đ";
function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function dinhDang(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

async function loadDoanhThu() {
    const tu = $("tu").value;
    const den = $("den").value;
    if (!tu || !den) return;
    if (tu > den) {
        alert("Ngày bắt đầu phải nhỏ hơn hoặc bằng ngày kết thúc.");
        return;
    }

    try {
        const res = await fetch("/doanh-thu/api?tu=" + encodeURIComponent(tu) + "&den=" + encodeURIComponent(den), { credentials: "include" });
        const data = await res.json();
        if (!res.ok) { alert(data.message); return; }

        $("tSoPhieu").textContent = data.soPhieu;
        $("tAnPhi").textContent = tien(data.tong.anphi);
        $("tPhiTHA").textContent = tien(data.tong.phithihanhan);
        $("tDoanhThu").textContent = tien(data.tong.thanhtien);

        const body = $("phieuBody");
        if (!data.phieu.length) {
            body.innerHTML = '<tr><td colspan="12" class="text-center text-muted">Không có phiếu thu trong khoảng này</td></tr>';
            $("phieuFoot").innerHTML = "";
            return;
        }
        body.innerHTML = data.phieu.map((p, i) => `
            <tr>
                <td>${i + 1}</td>
                <td>${esc(p.sophieu)}</td>
                <td>${new Date(p.ngaylap).toLocaleDateString("vi-VN")}</td>
                <td>${esc(p.mahoso || "—")}</td>
                <td>${esc(p.nguoithihanh)}</td>
                <td>${esc(p.loaihoso)}</td>
                <td>${esc(p.chaphanhvien || "—")}</td>
                <td>${esc(p.nguoinop)}</td>
                <td>${esc(p.nguoithu)}</td>
                <td class="text-end">${tien(p.anphi)}</td>
                <td class="text-end">${tien(p.phithihanhan)}</td>
                <td class="text-end">${tien(p.thanhtien)}</td>
            </tr>`).join("");
        $("phieuFoot").innerHTML = `
            <tr class="table-light fw-bold">
                <td colspan="9" class="text-end">Tổng cộng</td>
                <td class="text-end">${tien(data.tong.anphi)}</td>
                <td class="text-end">${tien(data.tong.phithihanhan)}</td>
                <td class="text-end">${tien(data.tong.thanhtien)}</td>
            </tr>`;
    } catch (err) {
        console.error(err);
        alert("Không tải được báo cáo doanh thu");
    }
}

async function signOut() {
    try {
        const res = await fetch("/dang-xuat", { method: "GET", credentials: "include" });
        const data = await res.json();
        alert(data.message);
        location = "/trang-chu";
    } catch (err) {
        console.error(err);
        alert("Error signing out");
    }
}

// Mặc định: từ ngày đầu tháng đến hôm nay
const now = new Date();
$("tu").value = dinhDang(new Date(now.getFullYear(), now.getMonth(), 1));
$("den").value = dinhDang(now);
loadDoanhThu();
</script>
</body>
</html>
