<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Người dân - Quản lý hồ sơ</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- HEADER -->
    <nav class="navbar navbar-dark bg-danger">
        <div class="container">
            <span class="navbar-brand">CỔNG DỊCH VỤ NGƯỜI DÂN</span>
            <div class="ms-auto">
            <button class="btn btn-outline-light" onclick="signOut()">Đăng xuất</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">

        <!-- TABS -->
        <ul class="nav nav-tabs" id="myTab">
            <li class="nav-item">
                <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#dangky">
                    Đăng ký hồ sơ
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tracuu">
                    Tra cứu hồ sơ
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tiendo">
                    Xem tiến độ
                </button>
            </li>
        </ul>

        <div class="tab-content mt-3">

            <!-- ĐĂNG KÝ HỒ SƠ -->
            <div class="tab-pane fade show active" id="dangky">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        Đăng ký hồ sơ thi hành án
                    </div>
                    <div class="card-body">

                        <form onsubmit="sendHoSo(event)">
                            <div class="mb-2">
                                <label>Tên người yêu cầu</label>
                                <input type="text" class="form-control">
                            </div>

                            <div class="mb-2">
                                <label>CCCD</label>
                                <input type="text" class="form-control">
                            </div>

                            <div class="mb-2">
                                <label>Nội dung yêu cầu</label>
                                <textarea class="form-control"></textarea>
                            </div>

                            <div class="mb-2">
                                <label>Loại hồ sơ</label>
                                <select class="form-control">
                                    <option>Dân sự</option>
                                    <option>Kinh doanh thương mại</option>
                                    <option>Hình sự</option>
                                    <option>Lao động</option>
                                    <option>Trọng tải thương mại</option>
                                    <option>Phá sản</option>
                                    <option>Hành chính</option>
                                    <option>Vụ việc cạnh tranh</option>
                                    <option>Tín dụng ngân hàng</option>
                                    <option>Biện pháp khẩn cấp tạm thời</option>
                                </select>
                            </div>
                            <button class="btn btn-danger">Gửi hồ sơ</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- TRA CỨU -->
            <div class="tab-pane fade" id="tracuu">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        Tra cứu hồ sơ
                    </div>
                    <div class="card-body">

                    <input type="text" class="form-control mb-3" placeholder="🔍 Tìm hồ sơ..." onkeyup="searchTable(this,'tableHoso')">

                    <table class="table table-bordered" id="tableHoso">
                        <thead>
                            <tr>
                                <th>Mã hồ sơ</th>
                                <th>Loại hồ sơ</th>
                                <th>Chi tiết hồ sơ</th>
                                <th>Giai đoạn thi hành án</th>
                                <th>Thao tác</th>
                            </tr>
                        </thead>

                        <tbody>
                        </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- TIẾN ĐỘ -->
            <div class="tab-pane fade" id="tiendo">
                <div class="card">
                    <div class="card-header bg-danger text-white">
                        Tiến độ xử lý hồ sơ
                    </div>
                    <div class="card-body">
                        <input type="text" class="form-control mb-2" placeholder="Nhập mã hồ sơ...">

                        <button class="btn btn-danger mb-3">Xem tiến độ</button>

                        <ul class="list-group">
                            <li class="list-group-item">01/01/2026 - Tiếp nhận hồ sơ</li>
                            <li class="list-group-item">02/01/2026 - Đang xác minh</li>
                            <li class="list-group-item">05/01/2026 - Đang xử lý</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    async function signOut() {
        try {
            const res = await fetch("/dang-xuat", {
                method: "GET",
                credentials: "include",
                headers: { "Content-Type":"application/json" }
            });
            
            const data = await res.json();
            alert(data.message);
            window.location.href = "/trang-chu";
        } catch (error) {
            console.error(error);
            alert("Error signing out");
        }
    }

    async function loadJudgements() {
        try {
            const res = await fetch("/ban-an/api", {
                method: "GET",
                credentials: "include",
                headers:{ "Content-Type":"application/json" }
            });

            if(res.status === 401) {
                const token = await fetch("/refresh", {
                    method: "GET",
                    credentials: "include",
                    headers:{ "Content-Type":"application/json" }
                });

                const data = token.json();

                alert({"message": "Yeet", "accessToken": token.accessToken});
            }

            const data = await res.json();
            alert(data.judgements.length + " judgements found.");

            let html = "";

            data.judgements.forEach(judgement => {
                switch(judgement.phase) {
                    case 1:
                        judgement.phase = "Khởi động";
                        break;
                    case 2:
                        judgement.phase = "Tự nguyện";
                        break;
                    case 3:
                        judgement.phase = "Xác nhận điều kiện";
                        break;
                    case 4:
                        judgement.phase = "Cưỡng chế";
                        break;
                    case 5:
                        judgement.phase = "Kết thúc";
                        break;
                }
                html += `
                <tr>
                    <td>${judgement.designation}</td>
                    <td>${judgement.classification}</td>
                    <td>${judgement.documents}</td>
                    <td>${judgement.phase}</td>
                    <td>
                        <button class="btn btn-warning btn-sm" onclick="editUser(${judgement.id}, '${judgement.fullname}', '${judgement.role}')">Sửa</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteUser(${judgement.id})">Xóa</button>
                    </td>
                </tr>
                `;
            });

            document.querySelector("tbody").innerHTML = html;
        } catch (error) {
            console.error(error);
            alert("Error finding judgements");
        }
    }

    async function sendJudgement(e){
        e.preventDefault();

        const tennguoi = document.querySelector("input[type='text']").value;
        const cccd = document.querySelectorAll("input")[1].value;
        const noidung = document.querySelector("textarea").value;
        const loaihoso = document.querySelector("select").value;

        const data = {
            tennguoi,
            cccd,
            noidung,
            loaihoso,
            danhmuc: "Chưa phân loại"
        };

        try {
            const res = await fetch("/ban-an/api", {
                method:"POST",
                credentials: "include",
                headers: { "Content-Type":"application/json" },
                body: JSON.stringify(data)
            });

            const obj = await res.json();
            alert(obj.message);

            // 🔥 reset form
            document.querySelector("form").reset();

            // 🔥 debug
            console.log(`Sent: ${data}`, );
        } catch (error) {
            console.error(error);
            alert("Error sending judgment request");
        }
    }

    window.addEventListener("DOMContentLoaded", () => {
        loadJudgements();
    });
    </script>
</body>
</html>
